on:
  workflow_call:
    inputs:
      dir:
        description: 'The subdirectory in use'
        required: true
        type: string

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive "${GITHUB_WORKSPACE}"
        continue-on-error: true
      
      - name: Terraform Init
        id: init
        run: |
          cd "${{ inputs.dir }}"
          terraform init -backend=false
        continue-on-error: true
      
      - name: Terraform Validate
        id: validate
        run: |
          cd "${{ inputs.dir }}"
          terraform validate -no-color
        continue-on-error: true
      
      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmtOutcome = '${{ steps.fmt.outcome }}' === 'success' ? 'PASS' : 'FAIL';
            const initOutcome = '${{ steps.init.outcome }}' === 'success' ? 'PASS' : 'FAIL';
            const validateOutcome = '${{ steps.validate.outcome }}' === 'success' ? 'PASS' : 'FAIL';
            
            const output = `#### Terraform Checks
            
            | Check | Result |
            |-------|--------|
            | Format | ${fmtOutcome} |
            | Init | ${initOutcome} |
            | Validate | ${validateOutcome} |
            
            **Directory:** \`${{ inputs.dir }}\`
            **Pushed by:** @${{ github.actor }}
            **Action:** \`${{ github.event_name }}\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Check Results
        if: steps.fmt.outcome != 'success' || steps.init.outcome != 'success' || steps.validate.outcome != 'success'
        run: exit 1
