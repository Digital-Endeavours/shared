on:
  workflow_call:

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
        continue-on-error: true
        id: lint
      
      - name: Update Pull Request - Lint Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const lintOutcome = '${{ steps.lint.outcome }}' === 'success' ? 'PASS' : 'FAIL';
            
            const output = `#### Markdown Linting
            
            | Check | Result |
            |-------|--------|
            | Lint | ${lintOutcome} |
            
            **Pushed by:** @${{ github.actor }}
            **Action:** \`${{ github.event_name }}\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Check Results
        if: steps.lint.outcome != 'success'
        run: exit 1
  
  markdown-links:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
        continue-on-error: true
        id: linkcheck
      
      - name: Update Pull Request - Link Check Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const linkOutcome = '${{ steps.linkcheck.outcome }}' === 'success' ? 'PASS' : 'FAIL';
            
            const output = `#### Markdown Link Check
            
            | Check | Result |
            |-------|--------|
            | Links | ${linkOutcome} |
            
            **Pushed by:** @${{ github.actor }}
            **Action:** \`${{ github.event_name }}\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Check Results
        if: steps.linkcheck.outcome != 'success'
        run: exit 1
