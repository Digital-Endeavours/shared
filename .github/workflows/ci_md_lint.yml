on:
  workflow_call:

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
        continue-on-error: true
        id: lint
      
      - name: Run markdownlint with output capture
        if: steps.lint.outcome != 'success'
        id: lint_errors
        run: |
          npm install -g markdownlint-cli2
          markdownlint-cli2 '**/*.md' > lint_output.txt 2>&1 || true
          echo "errors<<EOF" >> $GITHUB_OUTPUT
          cat lint_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Update Pull Request - Lint Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const lintOutcome = '${{ steps.lint.outcome }}' === 'success' ? 'PASS' : 'FAIL';
            const errors = `${{ steps.lint_errors.outputs.errors }}`;
            
            let output = `#### Markdown Linting
            
            | Check | Result |
            |-------|--------|
            | Lint | ${lintOutcome} |`;
            
            if (lintOutcome === 'FAIL' && errors) {
              output += `
            
            **Errors Found:**
            \`\`\`
            ${errors}
            \`\`\``;
            }
            
            output += `
            
            **Pushed by:** @${{ github.actor }}
            **Action:** \`${{ github.event_name }}\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Check Results
        if: steps.lint.outcome != 'success'
        run: exit 1
  
  markdown-links:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
        continue-on-error: true
        id: linkcheck
      
      - name: Capture link errors
        if: steps.linkcheck.outcome != 'success'
        id: link_errors
        run: |
          if [ -f md-link-check.log ]; then
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            cat md-link-check.log >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "errors=No error log found" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Update Pull Request - Link Check Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const linkOutcome = '${{ steps.linkcheck.outcome }}' === 'success' ? 'PASS' : 'FAIL';
            const errors = `${{ steps.link_errors.outputs.errors }}`;
            
            let output = `#### Markdown Link Check
            
            | Check | Result |
            |-------|--------|
            | Links | ${linkOutcome} |`;
            
            if (linkOutcome === 'FAIL' && errors) {
              output += `
            
            **Errors Found:**
            \`\`\`
            ${errors}
            \`\`\``;
            }
            
            output += `
            
            **Pushed by:** @${{ github.actor }}
            **Action:** \`${{ github.event_name }}\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Check Results
        if: steps.linkcheck.outcome != 'success'
        run: exit 1
